name: ci
on: [push, pull_request]
jobs:
  conformance-reproducibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install blake3 rfc8785 cryptography beautifulsoup4 html5lib
      - name: regenerate all vectors
        working-directory: conformance/generators
        run: for g in tv-*.py; do python "$g"; done
      - name: vectors must be byte-identical to committed
        run: git diff --exit-code conformance/vectors
  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - name: vet and test against TV-001
        working-directory: server
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
  # client-checks activated in S4.8: the TV-005 gate + JSDoc types.
  client-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: JS sanitizer vs TV-005 (tree equality + idempotence)
        run: node client/test/run-tv005.js
      - name: html`` escaping discipline
        run: node client/test/run-html.js
      - name: client urn:mlet construction (TV-001 anchor)
        run: node client/test/run-urn.js
      - name: JSDoc types (tsc --noEmit, shipping client code)
        run: |
          npm install -g typescript@5.5
          tsc --noEmit -p client/jsconfig.json
